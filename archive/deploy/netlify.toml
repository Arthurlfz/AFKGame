# Netlify 部署配置（放在仓库根）
# 发布目录 = 游戏代码根（含 index.html 和 游戏.html）
[build]
  publish = "新demo/Mvp/原型代码"

# 所有 HTML 不缓存：保证玩家每次拉到最新版本，避免改了不刷新
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

# 带 ?v= 版本号的 css/js（cache busting）可长缓存
[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 图片素材长缓存（文件名不变，内容稳定）
[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
