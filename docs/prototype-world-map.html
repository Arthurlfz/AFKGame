<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forge of Souls · 第1大陆大地图样板</title>
  <style>
    :root {
      --bg: #0b0c0e;
      --panel: #14161b;
      --panel-border: #252831;
      --text: #d1d4dc;
      --muted: #6c7280;
      --accent: #c9a227;
      --accent-glow: rgba(201, 162, 39, 0.45);
      --danger: #d96436;
      --danger-glow: rgba(217, 100, 54, 0.45);
      --locked: #4a4d55;
      --locked-glow: rgba(74, 77, 85, 0.35);
      --line-unlocked: rgba(201, 162, 39, 0.45);
      --line-locked: rgba(74, 77, 85, 0.3);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      overflow: hidden;
      user-select: none;
    }

    /* 顶部栏 */
    .topbar {
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--panel-border);
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .back-btn {
      padding: 6px 14px;
      background: transparent;
      border: 1px solid var(--panel-border);
      color: var(--text);
      cursor: pointer;
      border-radius: 4px;
      transition: border-color 0.15s, color 0.15s;
    }

    .back-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .tool-btn {
      padding: 6px 14px;
      background: transparent;
      border: 1px solid var(--panel-border);
      color: var(--text);
      cursor: pointer;
      border-radius: 4px;
      transition: border-color 0.15s, color 0.15s;
      font-size: 13px;
    }

    .tool-btn:hover { border-color: var(--accent); color: var(--accent); }
    .tool-btn.active { border-color: var(--danger); color: var(--danger); background: rgba(217,100,54,0.1); }

    .topbar-title {
      font-size: 16px;
      letter-spacing: 1px;
      color: var(--text);
    }

    .topbar-title b {
      color: var(--accent);
      font-weight: 600;
    }

    .level-control {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--muted);
    }

    .level-control input[type="range"] {
      width: 140px;
      accent-color: var(--accent);
    }

    .level-value {
      color: var(--accent);
      min-width: 36px;
      text-align: center;
      font-weight: 600;
    }

    /* 地图视口：平铺大地图（流放之路异界图风格） */
    .map-viewport {
      position: relative;
      width: 100%;
      height: calc(100% - 56px);
      overflow: hidden;
      background: #0e1016;
      cursor: grab;
    }

    .map-viewport.dragging { cursor: grabbing; }

    /* 地图包装：缩放平移 */
    .map-stage {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform-origin: 0 0;
      will-change: transform;
    }

    .map-bg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 4470px;
      height: 4470px;
      max-width: none;
      max-height: none;
      image-rendering: auto;
      pointer-events: none;
    }

    /* 连接线：覆盖整个 stage，用像素坐标与节点对齐 */
    .map-lines { display: none; }

    /* 节点：暗黑挂机网游风格（依据《游戏核心文档》§10 视觉规范） */
    .node {
      position: absolute;
      transform: translate(-50%, -50%);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      z-index: 5;
    }

    /* 节点标记：冷暗金属圈 + 腐化绿光晕，暗黑风 */
    .node-dot {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid #5a6b6f;
      background:
        radial-gradient(circle at 50% 42%, #2a3236 0%, #1b2125 60%, #11161a 100%);
      box-shadow:
        0 0 0 2px rgba(0,0,0,0.4),
        0 2px 6px rgba(0,0,0,0.6),
        inset 0 2px 4px rgba(120,150,150,0.12),
        inset 0 -3px 6px rgba(0,0,0,0.6);
      transition: transform 0.15s, box-shadow 0.3s, border-color 0.3s;
      position: relative;
    }

    .node:hover .node-dot { transform: scale(1.25); }

    .node.unlocked .node-dot {
      border-color: #c9a23a;
      background:
        radial-gradient(circle at 50% 42%, #3a4650 0%, #233038 60%, #16202a 100%);
      box-shadow:
        0 0 0 2px rgba(0,0,0,0.4),
        0 0 14px rgba(120,200,170,0.30),
        0 2px 6px rgba(0,0,0,0.6),
        inset 0 2px 4px rgba(140,220,190,0.18),
        inset 0 -3px 6px rgba(0,0,0,0.6);
    }

    .node.locked .node-dot {
      border-color: #3a4448;
      filter: grayscale(0.5) brightness(0.7);
      box-shadow:
        0 0 0 2px rgba(0,0,0,0.4),
        0 2px 5px rgba(0,0,0,0.55),
        inset 0 -3px 6px rgba(0,0,0,0.6);
    }

    /* 推荐节点：静态双层描边（不带动画/粒子，符合 §10） */
    .node.recommended .node-dot {
      border-color: #e0533a;
      box-shadow:
        0 0 0 2px rgba(224,83,58,0.45),
        0 0 14px rgba(224,83,58,0.35),
        0 2px 6px rgba(0,0,0,0.6),
        inset 0 -3px 6px rgba(0,0,0,0.6);
    }

    .node-icon {
      position: absolute;
      inset: 4px;
      width: calc(100% - 8px);
      height: calc(100% - 8px);
      object-fit: contain;
      /* 把手绘贴纸染成暗黑冷色调，统一视觉 */
      filter: brightness(0) invert(0.72) sepia(0.4) saturate(1.6) hue-rotate(140deg) drop-shadow(0 1px 1px rgba(0,0,0,0.5));
      pointer-events: none;
    }

    .node.locked .node-icon { filter: grayscale(0.7) brightness(0.5) drop-shadow(0 1px 1px rgba(0,0,0,0.5)); }

    /* 名字标签：暗色金属牌 + 冷金描边 */
    .node-name {
      font-family: "Microsoft YaHei", "PingFang SC", "Source Han Sans SC", sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: #d8e0e2;
      white-space: nowrap;
      padding: 3px 11px;
      border-radius: 4px;
      background: linear-gradient(180deg, rgba(26,32,38,0.92), rgba(16,20,24,0.92));
      border: 1px solid #4a5a5e;
      box-shadow:
        0 2px 5px rgba(0,0,0,0.6),
        inset 0 0 6px rgba(0,0,0,0.5);
      letter-spacing: 0.5px;
      transition: color 0.2s, border-color 0.2s, background 0.2s, transform 0.15s;
    }

    .node-name .node-level {
      font-size: 11px;
      font-weight: 600;
      color: #8fa6a2;
      margin-left: 7px;
      padding-left: 7px;
      border-left: 1px solid #3a484c;
    }

    .node.locked .node-name {
      color: #768086;
      border-color: #333d40;
      background: linear-gradient(180deg, rgba(20,24,28,0.9), rgba(12,15,18,0.9));
    }

    .node.locked .node-name .node-level { color: #5a6468; border-left-color: #2a3236; }

    .node:hover .node-name {
      color: #f0e6c0;
      border-color: #c9a23a;
      background: linear-gradient(180deg, rgba(34,40,34,0.95), rgba(20,24,20,0.95));
      transform: translateY(-1px);
    }

    .node.recommended .node-name {
      color: #f0d8c8;
      border-color: #e0533a;
    }

    /* 节点 Tooltip */
    .node-tooltip {
      position: absolute;
      left: 50%;
      bottom: 110%;
      transform: translateX(-50%) translateY(-8px);
      background: rgba(20, 22, 27, 0.96);
      border: 1px solid var(--panel-border);
      padding: 10px 12px;
      border-radius: 6px;
      min-width: 170px;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.15s, visibility 0.15s, transform 0.15s;
      z-index: 10;
      box-shadow: 0 4px 16px rgba(0,0,0,0.45);
    }

    .node:hover .node-tooltip {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(-4px);
    }

    .tooltip-title {
      font-size: 13px;
      color: var(--accent);
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .tooltip-row {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.6;
    }

    .tooltip-row span { color: var(--text); }

    .tooltip-locked {
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px solid var(--panel-border);
      font-size: 12px;
      color: var(--danger);
    }

    /* 底部提示 */
    .map-hint {
      position: absolute;
      left: 20px;
      bottom: 16px;
      color: var(--muted);
      font-size: 12px;
      pointer-events: none;
      z-index: 20;
    }

    .map-hint kbd {
      background: rgba(255,255,255,0.08);
      padding: 2px 6px;
      border-radius: 3px;
      border: 1px solid var(--panel-border);
      color: var(--text);
    }

    /* 缩放按钮 */
    .zoom-controls {
      position: absolute;
      right: 20px;
      bottom: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 20;
    }

    .zoom-btn {
      width: 32px;
      height: 32px;
      background: var(--panel);
      border: 1px solid var(--panel-border);
      color: var(--text);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      transition: border-color 0.15s, color 0.15s;
    }

    .zoom-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .zoom-value {
      color: var(--accent);
      font-size: 11px;
      text-align: center;
      margin-top: 4px;
    }

    .mark-status {
      position: fixed;
      top: 64px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 22, 27, 0.95);
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      z-index: 100;
      display: none;
      pointer-events: none;
    }
    .mark-status.show { display: block; }
  </style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <button class="back-btn">返回</button>
    <div class="topbar-title"><b>Forge of Souls</b> · 第1大陆</div>
    <button class="tool-btn" id="mark-btn">打点模式：关</button>
    <button class="tool-btn" id="export-btn">导出坐标</button>
  </div>
  <label class="level-control">
    样板玩家等级
    <input type="range" id="level-slider" min="1" max="100" value="1">
    <span class="level-value" id="level-display">Lv.1</span>
  </label>
</div>

<div class="mark-status" id="mark-status"></div>

<div class="map-viewport" id="viewport">
  <div class="map-stage" id="stage">
    <!-- 平铺大地图（流放之路异界图风格） -->
    <img class="map-bg" id="map-bg" src="assets/world-map.png" alt="world map">

    <svg class="map-lines" id="map-lines" xmlns="http://www.w3.org/2000/svg">
      <!-- 连接线由 JS 生成 -->
    </svg>

    <!-- 节点由 JS 生成 -->
    <div id="nodes-layer"></div>
  </div>

  <div class="map-hint">
    <kbd>滚轮</kbd> 缩放 · <kbd>拖拽</kbd> 平移 · <kbd>点击节点</kbd> 进入战斗
  </div>

  <div class="zoom-controls">
    <button class="zoom-btn" id="zoom-in">+</button>
    <button class="zoom-btn" id="zoom-out">-</button>
    <div class="zoom-value" id="zoom-display">100%</div>
  </div>
</div>

<script>
  // 第1大陆 6 个区域节点（用户在页面打点模式确认的坐标，已固定）
  // 命名依据《第1大陆完整设计 v1》（已确认）；等级段/掉落依据文档规划
  const areas = [
    { id: 'corrupted-forest', name: '枯荣之地', level: 1,  levelRange: 'Lv.1-10',  rec: '成长 1~2',   drops: '白装 / 基础材料',   icon: 'nortantis-stickers/区域专属_枯荣之地.png', x: 0.600, y: 0.560 },
    { id: 'weeping-marsh',    name: '泣腐泥沼', level: 10, levelRange: 'Lv.10-20', rec: '成长 3~4',   drops: '白装 / 进化素材',   icon: 'nortantis-stickers/区域专属_泣腐泥沼.png', x: 0.720, y: 0.590 },
    { id: 'bone-field',       name: '白骨旷野', level: 20, levelRange: 'Lv.20-30', rec: '成长 5~6',   drops: '蓝装 / 中期材料',   icon: 'nortantis-stickers/区域专属_白骨旷野.png', x: 0.640, y: 0.700 },
    { id: 'shadow-maze',      name: '幽影迷境', level: 30, levelRange: 'Lv.30-40', rec: '成长 8~9',   drops: '高级蓝装 / 打造材料', icon: 'nortantis-stickers/区域专属_幽影迷境.png', x: 0.560, y: 0.780 },
    { id: 'blood-rift',       name: '血潮裂谷', level: 40, levelRange: 'Lv.40-50', rec: '成长 11~13', drops: '金装 / 高阶进化素材', icon: 'nortantis-stickers/区域专属_血潮裂谷.png', x: 0.780, y: 0.720 },
    { id: 'decay-origin',     name: '腐变之源', level: 50, levelRange: 'Lv.50-60', rec: '成长 15~17', drops: '毕业装备 / 传说素材', icon: 'nortantis-stickers/区域专属_腐变之源.png', x: 0.700, y: 0.840 }
  ];

  const ISLAND_CENTER = { x: 0.5, y: 0.5 };

  const viewport = document.getElementById('viewport');
  const stage = document.getElementById('stage');
  const nodesLayer = document.getElementById('nodes-layer');
  const mapLines = document.getElementById('map-lines');
  const mapBg = document.getElementById('map-bg');
  const levelSlider = document.getElementById('level-slider');
  const levelDisplay = document.getElementById('level-display');
  const zoomDisplay = document.getElementById('zoom-display');
  const markBtn = document.getElementById('mark-btn');
  const exportBtn = document.getElementById('export-btn');
  const markStatus = document.getElementById('mark-status');

  let scale = 1;
  let translateX = 0;
  let translateY = 0;
  let isDragging = false;
  let lastX = 0;
  let lastY = 0;

  // 打点模式状态
  let markMode = false;
  let markIndex = 0;

  const MIN_SCALE = 0.12;
  const MAX_SCALE = 4.0;

  // 获取地图图片的实际显示尺寸（用于把百分比坐标转为像素）
  function getMapRect() {
    return mapBg.getBoundingClientRect();
  }

  function getStageCenter() {
    const vRect = viewport.getBoundingClientRect();
    return { x: vRect.width / 2, y: vRect.height / 2 };
  }

  function updateTransform() {
    stage.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
    zoomDisplay.textContent = Math.round(scale * 100) + '%';
  }

  // 缩放到指定倍率，以视口中心为锚点
  function zoomTo(newScale, anchorX, anchorY) {
    const vRect = viewport.getBoundingClientRect();
    anchorX = anchorX ?? vRect.width / 2;
    anchorY = anchorY ?? vRect.height / 2;

    const oldScale = scale;
    scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, newScale));

    // 保持锚点世界坐标不变
    const worldX = (anchorX - translateX) / oldScale;
    const worldY = (anchorY - translateY) / oldScale;
    translateX = anchorX - worldX * scale;
    translateY = anchorY - worldY * scale;

    updateTransform();
  }

  // 滚轮缩放
  viewport.addEventListener('wheel', (e) => {
    e.preventDefault();
    const delta = e.deltaY > 0 ? -0.1 : 0.1;
    zoomTo(scale + delta, e.clientX, e.clientY);
  }, { passive: false });

  // 拖拽平移
  viewport.addEventListener('mousedown', (e) => {
    if (e.target.closest('.node')) return;
    isDragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
    viewport.classList.add('dragging');
  });

  window.addEventListener('mousemove', (e) => {
    if (!isDragging) return;
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    translateX += dx;
    translateY += dy;
    lastX = e.clientX;
    lastY = e.clientY;
    updateTransform();
  });

  window.addEventListener('mouseup', () => {
    isDragging = false;
    viewport.classList.remove('dragging');
  });

  // 缩放按钮
  document.getElementById('zoom-in').onclick = () => zoomTo(scale + 0.25);
  document.getElementById('zoom-out').onclick = () => zoomTo(scale - 0.25);

  // 打点模式：在岛屿上依次点 6 下，实时钉节点
  function setMarkMode(on) {
    markMode = on;
    markBtn.textContent = '打点模式：' + (on ? '开' : '关');
    markBtn.classList.toggle('active', on);
    if (on) {
      markIndex = 0;
      showMarkStatus('打点模式：依次点击 图1 → 图6 的位置（共 6 下）');
    } else {
      hideMarkStatus();
    }
  }

  function showMarkStatus(text) {
    markStatus.textContent = text;
    markStatus.classList.add('show');
  }
  function hideMarkStatus() {
    markStatus.classList.remove('show');
  }

  markBtn.addEventListener('click', () => setMarkMode(!markMode));

  // 打点时点击视口，记录该区域节点位置（屏幕百分比，直接钉在 stage）
  viewport.addEventListener('click', (e) => {
    if (!markMode) return;
    if (e.target.closest('.node')) return;
    if (markIndex >= areas.length) return;

    const vRect = viewport.getBoundingClientRect();
    const px = (e.clientX - vRect.left) / vRect.width;
    const py = (e.clientY - vRect.top) / vRect.height;
    areas[markIndex].x = px;
    areas[markIndex].y = py;

    const area = areas[markIndex];
    showMarkStatus(`已记录 ${area.name}  x=${px.toFixed(3)} y=${py.toFixed(3)}  （${markIndex + 1}/6）`);
    renderNodes(parseInt(levelSlider.value, 10));

    markIndex++;
    if (markIndex >= areas.length) {
      setTimeout(() => {
        setMarkMode(false);
        showMarkStatus('打点完成！6 个节点已固定。点「导出坐标」可复制数值。');
        setTimeout(hideMarkStatus, 2500);
      }, 200);
    }
  });

  // 导出坐标到页面提示
  exportBtn.addEventListener('click', () => {
    const lines = areas.map(a => `${a.name}: x=${a.x.toFixed(3)}, y=${a.y.toFixed(3)}`).join('\n');
    showMarkStatus('坐标已复制到控制台，按 F12 → Console 查看');
    console.log('=== 第1大陆节点坐标 ===\n' + lines);
    alert(lines);
  });

  // 生成节点（坐标按用户在屏幕上的点位，随 stage 一起缩放/平移）
  function renderNodes(playerLevel) {
    nodesLayer.innerHTML = '';

    const vRect = viewport.getBoundingClientRect();

    // 把屏幕百分比换算成 stage 坐标（stage 原点 = 视口左上角，节点在 stage 里绝对定位）
    const toStageX = (px) => px * vRect.width;
    const toStageY = (py) => py * vRect.height;

    const unlockedAreas = [];

    areas.forEach((area, idx) => {
      const unlocked = playerLevel >= area.level;
      const recommended = unlocked &&
        (idx === areas.length - 1 || playerLevel < areas[idx + 1].level);

      if (unlocked) unlockedAreas.push(area);

      const node = document.createElement('div');
      node.className = 'node' + (unlocked ? ' unlocked' : ' locked') + (recommended ? ' recommended' : '');
      node.style.left = toStageX(area.x) + 'px';
      node.style.top = toStageY(area.y) + 'px';

      node.innerHTML = `
        <div class="node-dot">
          <img class="node-icon" src="assets/${area.icon}" alt="">
        </div>
        <div class="node-name">${area.name}<span class="node-level">${area.levelRange}</span></div>
        <div class="node-tooltip">
          <div class="tooltip-title">${area.name}</div>
          <div class="tooltip-row">等级段：<span>${area.levelRange}</span></div>
          <div class="tooltip-row">推荐：<span>${area.rec}</span></div>
          <div class="tooltip-row">主要掉落：<span>${area.drops}</span></div>
          ${unlocked ? '' : `<div class="tooltip-locked">需达到 Lv.${area.level} 解锁</div>`}
        </div>
      `;

      if (unlocked) {
        node.addEventListener('click', () => {
          // 样板中只提示，不真跳转
          alert(`进入战斗面板：${area.name}\n推荐 ${area.rec}\n实际接入后会切到「野外探险」页并自动开始战斗。`);
        });
      }

      nodesLayer.appendChild(node);
    });
  }

  // 等级滑块改变时重渲染
  levelSlider.addEventListener('input', () => {
    const lv = parseInt(levelSlider.value, 10);
    levelDisplay.textContent = 'Lv.' + lv;
    renderNodes(lv);
  });

  // 初始化：地图以原始像素尺寸铺在 stage，初始缩放让整张 4470 图刚好能看全
  // 这样放大后是真分辨率，不会糊
  function init() {
    const vRect = viewport.getBoundingClientRect();
    // 让 4470px 的图缩放到视口内（留 4% 边距）
    scale = Math.min(vRect.width / 4470, vRect.height / 4470) * 0.96;
    scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, scale));
    updateTransform();

    // 把图片（居中显示，top/left 50% translate -50%）挪到视口中央
    const mapRect = getMapRect();
    const imgCenterX = mapRect.left - vRect.left + mapRect.width / 2;
    const imgCenterY = mapRect.top - vRect.top + mapRect.height / 2;
    translateX = vRect.width / 2 - imgCenterX;
    translateY = vRect.height / 2 - imgCenterY;
    updateTransform();
    renderNodes(1);
  }

  // 等图片加载完成再初始化，否则尺寸不对
  if (mapBg.complete) {
    init();
  } else {
    mapBg.onload = init;
  }

  // 窗口大小变化时重置
  window.addEventListener('resize', init);
</script>

</body>
</html>
