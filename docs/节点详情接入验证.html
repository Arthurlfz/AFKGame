<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>节点详情页 · 接入验证</title>
<link rel="stylesheet" href="css/design-tokens.css">
<link rel="stylesheet" href="css/game.css">
<style>
  body { background: #080b0c; padding: 20px; font-family: var(--font-body); }
  .vm-stage { position: relative; max-width: 1280px; margin: 0 auto; }
  .vm-stage .worldmap-stage { position: relative; min-height: 720px; background: linear-gradient(180deg, #141a1b, #0b0e0f); border: 1px solid rgb(255 255 255 / .08); border-radius: 6px; }
  .vm-ctl { margin-bottom: 12px; display: flex; gap: 10px; align-items: center; color: #9aa5a5; font-size: 13px; }
  .vm-ctl button { padding: 8px 16px; cursor: pointer; background: rgb(0 0 0 / .35); border: 1px solid rgb(255 255 255 / .15); border-radius: 4px; color: #d8c9a3; font-size: 13px; letter-spacing: 2px; }
  .vm-ctl button:hover { border-color: #b89b59; }
</style>
</head>
<body>
<div class="vm-ctl">
  <span>验证：点击下方按钮模拟「世界地图点选节点」→ 应弹出节点详情页</span>
  <button onclick="window.demoOpen('corrupted-forest')">图1 枯荣之地</button>
  <button onclick="window.demoOpen('plague-swamp')">图2 泣腐泥沼</button>
</div>
<div class="vm-stage">
  <div class="worldmap-stage" id="vm-map">
    <div class="worldmap-canvas-wrap" id="worldmap-canvas-wrap" style="position:absolute;inset:0">
      <div class="worldmap-canvas" id="worldmap-canvas" style="position:absolute;inset:0;background:#101516"></div>
      <div class="worldmap-tip" id="worldmap-tip" hidden></div>
    </div>
    <!-- 与游戏.html 相同的节点详情容器 -->
    <div class="area-detail" id="area-detail" hidden>
      <div class="nd-page" id="area-detail-body"></div>
    </div>
  </div>
</div>

<script>
/* ============ mock（只覆盖详情页渲染所需的最小面） ============ */
window.Config = { battle: { areas: [
  { id: 'corrupted-forest', name: '枯荣之地', levelRange: [1, 6], recommended: '成长 3', recGrowth: 3, difficulty: 1.0, enemyIds: ['wild-rotten', 'wild-bloodfox'] },
  { id: 'plague-swamp', name: '泣腐泥沼', levelRange: [7, 12], recommended: '成长 5', recGrowth: 5, difficulty: 1.0, enemyIds: ['wild-rotten', 'wild-bloodfox', 'wild-bonewolf', 'wild-bogfrog'] }
] } };
window.EnemyData = { list: [
  { id: 'wild-rotten', name: '腐噜兽', icon: '🐹', level: 6, enemyType: 'normal' },
  { id: 'wild-bloodfox', name: '血狐', icon: '🦊', level: 9, enemyType: 'normal' },
  { id: 'wild-bonewolf', name: '骨狼', icon: '🐺', level: 14, enemyType: 'evolved' },
  { id: 'wild-bogfrog', name: '毒沼蛙', icon: '🐸', level: 15, enemyType: 'evolved' }
] };
window.Quest = { isAreaCleared: id => id === 'plague-swamp', getQuests: () => [
  { type: 'collect_loop', area: 'corrupted-forest', name: '收集枯叶 ×10', progress: 4, need: 10 }
] };
window.Pet = { pets: [
  { id: 'p1', name: '血狐', icon: '🦊', level: 24, growth: 42.5 },
  { id: 'p2', name: '幽火狐', icon: '🦊', level: 60, growth: 62.0 },
  { id: 'p3', name: '赤霄神龙', icon: '🐉', level: 60, growth: 66.0, isGodPet: true },
  { id: 'p4', name: '冥霜狼', icon: '🐺', level: 60, growth: 63.5 }
], activeId: 'p1',
  getPets() { return this.pets; }, getActivePet() { return this.pets.find(p => p.id === this.activeId) || null; },
  setActive(id) { this.activeId = id; }, isGodPet(p) { return !!p.isGodPet; }
};
window.Battle = { selectArea: () => true, getCurrentArea: () => window.Config.battle.areas[0] };
window.UI = {
  $: id => document.getElementById(id),
  escapeHtml: s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])),
  switchPage: () => console.log('[vm] switchPage'),
  updateBattleArea: () => {}, showToast: (t, d) => console.log('[vm] toast:', t, d), addLog: () => {}
};
</script>
<script src="js/core/pet-sprites.js"></script>
<script src="js/ui/ui-worldmap.js"></script>
<script>
  window.demoOpen = function (areaId) {
    const areas = window.Config.battle.areas;
    const a = areas.find(x => x.id === areaId);
    const point = { name: a.name, areaId: a.id, type: 'wild', _preview: { gold: areaId === 'corrupted-forest' ? 2 : 2.5 } };
    window.UI.showAreaDetail(point);
  };
  // 初始打开图1 供直接查看
  window.demoOpen('corrupted-forest');
</script>
</body>
</html>
