<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge of Souls UI 切片预览</title>
<link rel="stylesheet" href="css/design-tokens.css">
<style>
  :root {
    --asset-panel: none;
    --asset-button-primary: none;
    --asset-button-secondary: none;
    --asset-groove: none;
    --asset-title: none;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at 50% 0%, #282018 0, var(--bg) 52%);
    color: var(--text);
    font-family: var(--font-body);
  }
  .preview { width: min(920px, calc(100% - 32px)); margin: 0 auto; padding: 48px 0 80px; }
  h1 { margin: 0 0 8px; color: var(--accent-hi); font-family: var(--font-title); letter-spacing: 2px; }
  .intro { margin: 0 0 30px; color: var(--text-dim); }
  .panel {
    position: relative;
    min-height: 430px;
    padding: 78px 92px 64px;
    background: var(--panel) var(--asset-panel) center / 100% 100% no-repeat;
    filter: drop-shadow(0 16px 26px rgba(0,0,0,.55));
  }
  .title {
    position: absolute;
    top: 25px;
    left: 12%;
    right: 12%;
    height: 44px;
    display: grid;
    place-items: center;
    background: var(--asset-title) center / 100% 100% no-repeat;
    color: var(--text-hi);
    font-weight: 900;
    letter-spacing: 2px;
    text-shadow: 0 2px 4px #000;
  }
  .content {
    min-height: 285px;
    padding: 28px 34px;
    background: rgba(9, 8, 7, .78);
    border: 1px solid rgba(198, 154, 79, .32);
  }
  .content p { margin: 0 0 24px; color: var(--text-dim); line-height: 1.7; }
  .bars { display: grid; gap: 12px; margin-bottom: 28px; }
  .bar { height: 28px; padding: 5px; background: var(--asset-groove) center / 100% 100% no-repeat; }
  .bar::after { content: ''; display: block; height: 100%; width: 74%; background: var(--hp); box-shadow: inset 0 1px rgba(255,255,255,.25); }
  .bar:nth-child(2)::after { width: 48%; background: var(--energy); }
  .actions { display: flex; flex-wrap: wrap; gap: 16px; }
  button {
    min-width: 190px;
    min-height: 62px;
    padding: 0 34px;
    border: 0;
    background-color: transparent;
    background-position: center;
    background-size: 100% 100%;
    background-repeat: no-repeat;
    color: var(--text-hi);
    font: 800 var(--fs-md) var(--font-body);
    text-shadow: 0 2px 4px #000;
    cursor: pointer;
  }
  .primary { background-image: var(--asset-button-primary); }
  .secondary { background-image: var(--asset-button-secondary); }
  button:hover { filter: brightness(1.16); }
  .note { margin-top: 20px; color: var(--text-faint); font-size: var(--fs-sm); }
  @media (max-width: 640px) {
    .preview { width: min(100% - 20px, 920px); padding-top: 24px; }
    .panel { min-height: 380px; padding: 70px 35px 40px; }
    .content { padding: 22px 18px; }
    button { min-width: 150px; min-height: 52px; padding: 0 20px; }
  }
</style>
</head>
<body>
<main class="preview">
  <h1>UI 切片实际接入预览</h1>
  <p class="intro">先用现有切片拼一个面板，不修改正式页面和现有 CSS Token。</p>
  <section class="panel">
    <div class="title">宠物属性</div>
    <div class="content">
      <p>这是一次真实组件组合测试。重点观察边框是否过重、内容区是否干净，以及按钮与面板是否属于同一套视觉语言。</p>
      <div class="bars"><div class="bar"></div><div class="bar"></div></div>
      <div class="actions"><button class="primary">开始自动战斗</button><button class="secondary">返回地图</button></div>
    </div>
  </section>
  <p class="note">素材仅用于预览：面板 01，主按钮 06，次按钮 07，状态槽 10，标题装饰 15。</p>
</main>
</body>
</html>
