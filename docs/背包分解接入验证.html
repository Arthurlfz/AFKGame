<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>背包分解接入验证</title>
<style>
  html, body { margin: 0; padding: 0; background: #0e0f14; color: #e8e2d4; font-family: 'PingFang SC','Microsoft YaHei',sans-serif; }
  .top { padding: 10px 16px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid #2a2d3a; }
  .top button { padding: 6px 14px; cursor: pointer; }
  #bag-window { position: fixed; inset: 0; z-index: 90; display: none; }
  .bag-window-scrim { position: absolute; inset: 0; background: rgba(0,0,0,.55); }
  .bag-window { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: min(1180px, 94vw); max-height: 88vh; background: #171a22; border: 1px solid #3a3f52; border-radius: 12px; display: flex; flex-direction: column; }
  .bag-window-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid #2a2d3a; }
  .bag-window-title { font-size: 17px; font-weight: 700; }
  .bag-window-subtitle { font-size: 12px; color: #8b90a0; }
  .bag-window-close { background: none; border: none; color: #e8e2d4; font-size: 20px; cursor: pointer; }
  .bag-window-tabs { display: flex; gap: 4px; padding: 8px 16px 0; }
  .bag-subtab { padding: 7px 16px; cursor: pointer; background: #20242f; border: 1px solid #333849; color: #aeb3c2; border-radius: 8px 8px 0 0; }
  .bag-subtab.active { background: #262b38; color: #f0d48a; }
  .bag-window-body { padding: 12px 16px 16px; overflow: auto; }
  .equip-workbench { display: flex; gap: 12px; }
  .ew-col { flex: 1 1 0; min-width: 0; }
  .ew-pet { flex: 0 0 300px; }
  .ew-detail { flex: 0 0 320px; }
  .panel { background: #1d212c; border: 1px solid #2c3142; border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
  .panel-title { font-weight: 700; font-size: 14px; margin-bottom: 8px; }
  .panel-title .hint { font-weight: 400; font-size: 12px; color: #8b90a0; margin-left: 6px; }
  .inv-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .inv-toolbar .hint { font-size: 12px; color: #8b90a0; flex: 1; }
  .btn-mini { padding: 4px 12px; font-size: 12px; cursor: pointer; border-radius: 6px; border: 1px solid #3a4055; background: #262b38; color: #dfe3ee; }
  .btn-mini.ghost { background: transparent; }
  .btn-mini.danger { border-color: #6b3940; color: #e28b90; }
  .btn-mini:disabled { opacity: .4; cursor: not-allowed; }
  .inv-list { max-height: 430px; overflow: auto; }
  .equip-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .equip-card { border: 1px solid #333849; border-radius: 8px; padding: 8px; background: #20242f; cursor: pointer; }
  .equip-card.selected { border-color: #e0a94f; box-shadow: 0 0 0 1px #e0a94f; }
  .equip-card.locked { opacity: .8; }
  .ec-name { font-weight: 700; font-size: 13px; }
  .ec-meta, .ec-slot { font-size: 11px; color: #9aa0b1; }
  .eq-new { color: #7ee08b; font-size: 10px; margin-right: 4px; }
  .eq-lock { font-size: 10px; }
  .ec-actions { display: flex; gap: 6px; margin-top: 6px; }
  .btn-sm { font-size: 11px; padding: 3px 8px; cursor: pointer; background: #2c3142; border: 1px solid #3a4055; color: #dfe3ee; border-radius: 5px; }
  .btn-sm.lock.on { border-color: #d8a94f; color: #f0d48a; }
  .eq-detail { border: 1px dashed #3a4055; border-radius: 8px; padding: 10px; min-height: 200px; }
  .eq-detail-empty { color: #8b90a0; font-size: 13px; }
  .inv-empty { color: #8b90a0; font-size: 13px; padding: 20px; text-align: center; }
  #log { padding: 8px 16px; font-size: 12px; color: #7ee08b; white-space: pre-wrap; }
</style>
</head>
<body>
<div class="top">
  <button onclick="demoOpenBag()">打开背包浮窗</button>
  <button onclick="demoOpenEquipTab()">切到装备tab</button>
  <span id="status" style="font-size:13px;color:#8b90a0">—</span>
</div>

<!-- 背包浮窗（结构取自游戏.html，装备tab已并入分解网格） -->
<div class="bag-window-host" id="bag-window" style="display:none">
  <div class="bag-window-scrim" id="bag-scrim"></div>
  <aside class="bag-window" aria-label="背包窗口">
    <header class="bag-window-header">
      <div class="bag-window-heading">
        <div class="bag-window-title">🎒 背包</div>
        <div class="bag-window-subtitle">装备 / 素材 / 消耗品 / 宠物蛋 分类查看</div>
      </div>
      <button class="bag-window-close" id="bag-cancel" type="button" aria-label="关闭背包">×</button>
    </header>
    <div class="bag-window-tabs">
      <button class="bag-subtab active" data-bag-subtab="bag">📦 背包</button>
      <button class="bag-subtab" data-bag-subtab="equip">⚔️ 装备</button>
    </div>
    <div class="bag-window-body">
      <div class="bag-subpane active" data-bag-subpane="bag">
        <div id="bag-root"><div class="inv-empty">背包浮窗 · 背包分类页（本轮验证装备tab的分解）</div></div>
      </div>
      <div class="bag-subpane" data-bag-subpane="equip" style="display:none">
        <div class="equip-workbench">
          <div class="ew-col ew-pet">
            <div class="panel">
              <div class="panel-title">当前装备<span class="hint">点击槽位看详情 · 脱下在右侧</span></div>
              <div class="equip-slots" id="equip-slots"></div>
            </div>
            <div class="panel">
              <div class="panel-title">出战宠物<span class="hint">属性含装备加成</span></div>
              <div style="font-size:13px;color:#9aa0b1">血狐 · Lv.24（mock）</div>
            </div>
          </div>
          <div class="ew-col ew-bag">
            <div class="panel">
              <div class="panel-title">背包<span class="hint">点选装备看详情与打造 · 多选批量分解</span></div>
              <div id="inv-filter" class="inv-filter"></div>
              <div class="inv-toolbar">
                <span class="hint" id="inv-count">共 0 件</span>
                <button class="btn-mini ghost" id="btn-select-all">全选</button>
                <button class="btn-mini danger" id="btn-salvage-selected" disabled>批量分解（0）</button>
              </div>
              <div class="inv-list" id="inv-list"></div>
            </div>
          </div>
          <div class="ew-col ew-detail">
            <aside class="eq-detail" id="bag-eq-detail" aria-label="装备详情与打造">
              <div class="eq-detail-empty">← 点选一件装备，右侧显示详情与打造</div>
              <div class="eq-detail-body" style="display:none">
                <div class="eq-detail-craft"></div>
              </div>
            </aside>
          </div>
        </div>
      </div>
    </div>
  </aside>
</div>

<div id="log"></div>

<script>
/* ============ mock（对齐游戏运行时依赖，$ 必须 getElementById） ============ */
const escapeHtml = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId = id => document.getElementById(id);
window.Drop = { getEggCount: () => 0, getEggs: () => [], hatchEgg: async () => ({}) };
window.Materials = { getLocal: () => [], getQuantity: (n) => (n === '鉴定石' ? 5 : 0), spend: async () => ({ ok: true }) };
window.UI = {
  $: byId,
  escapeHtml,
  showToast: (t, d) => { console.log('toast:', t, d); },
  addLog: (t) => { const l = document.getElementById('log'); if (l) l.textContent += (l.textContent ? '\n' : '') + t; },
  renderAll: () => {
    if (window.UI.renderInvFilter) window.UI.renderInvFilter();
    if (window.UI.renderInventory) window.UI.renderInventory();
    if (window.UI.renderInvToolbar) window.UI.renderInvToolbar();
  },
  makeDraggable: () => {},
  EQUIP_ICON: { weapon: '⚔️', armor: '🛡', helm: '⛑', amulet: '📿', ring: '💍', boots: '👢', gloves: '🧤', belt: '🧵' },
  renderCraftInto: (el, eq) => { el.innerHTML = '<div style="color:#7ee08b;font-size:13px">【打造区】' + escapeHtml(eq.name) + ' · T' + (eq.tier ?? 4) + '</div>'; },
};
window.Config = {
  craft: {
    stone: { name: '打造石', icon: '🪨' }, gem: { name: '灵晶', icon: '💠' },
    reforge: { name: '重铸石', icon: '🎲' }, strip: { name: '剥离石', icon: '✂️' },
    holy: { name: '圣化石', icon: '🔮' }, augment: { name: '增幅石', icon: '➕' },
  },
  battle: { areas: [] },
};
window.Pet = {
  getActivePet: () => ({ name: '血狐', level: 24, equipment: {} }),
  getStats: (p) => ({ atk: 100, hp: 800, def: 50, spd: 10, critRate: .1, critDamage: 1.5, hit: .9, dodge: .05, lifesteal: 0, pen: 0, dmgBonus: 0, dr: 0 }),
};
window.Equipment = {
  SLOTS: ['weapon','armor','helm','amulet','ring','boots','gloves','belt'],
  getInventory: () => window.__INV__,
  equipItem: () => null,
  describeItem: e => e.name,
  scoreOf: e => e._score ?? 10,
  flattenAffixes: (a) => (a && a.length ? a : []),
  formatAffixHtml: (a, cls) => '<div class="' + (cls || '') + '">' + escapeHtml(a.label) + ' +' + a.value + '</div>',
  normalizeAffixes: (a) => (a && a.prefix ? a : { prefix: [], suffix: [] }),
  rarityOf: e => (e.rarity && e.rarity.id ? e.rarity : { id: 'white', label: '白色', color: '#b2aa9c' }),
  ilvlOf: e => e.level ?? 1,
};
window.Salvage = {
  toggleLock: async (eq) => { eq.locked = !eq.locked; },
  previewEquips: (list) => {
    const by = { white: 0, blue: 0, gold: 0 };
    for (const e of list) by[e.rarity.id] = (by[e.rarity.id] || 0) + 1;
    return { count: list.length, skipped: 0, byRarity: by, gains: { stone: list.length * 2, gem: list.length } };
  },
  salvageList: async (list) => ({ count: list.length, gains: { stone: list.length * 2, gem: list.length }, skipped: 0 }),
  belowThreshold: () => [],
  salvageBelow: async () => ({ count: 0, gains: {} }),
};

/* ============ 装备数据 ============ */
window.__INV__ = [
  { id: 'e1', name: '铁刃', slot: 'weapon', rarity: { id: 'white', label: '白色', color: '#b2aa9c' }, base: { label: '攻击', value: 5 }, tier: 1, level: 5, locked: false, affixes: [], _score: 6 },
  { id: 'e2', name: '霜狼皮甲', slot: 'armor', rarity: { id: 'blue', label: '蓝色', color: '#4f8ddb' }, base: { label: '生命', value: 30 }, tier: 2, level: 12, locked: false, fresh: true, affixes: [{ label: '生命', value: 12, base: true }], _score: 18 },
  { id: 'e3', name: '赤霄金冠', slot: 'helm', rarity: { id: 'gold', label: '金色', color: '#e0a94f' }, base: { label: '防御', value: 8 }, tier: 4, level: 45, locked: true, affixes: [{ label: '防御', value: 20 }], _score: 55 },
  { id: 'e4', name: '枯骨指环', slot: 'ring', rarity: { id: 'blue', label: '蓝色', color: '#4f8ddb' }, base: { label: '攻击', value: 4 }, tier: 2, level: 15, locked: false, affixes: [{ label: '暴击率', value: 3 }], _score: 14 },
  { id: 'e5', name: '赤霄战刃', slot: 'weapon', rarity: { id: 'gold', label: '金色', color: '#e0a94f' }, base: { label: '攻击', value: 12 }, tier: 5, level: 52, locked: false, identified: false, affixes: [{ label: '攻击', value: 40 }, { label: '暴击率', value: 8 }], _score: 88 },
];
window.demoOpenBag = () => { if (window.UI.openBagWindow) window.UI.openBagWindow(); };
window.demoOpenEquipTab = () => {
  const btn = document.querySelector('.bag-subtab[data-bag-subtab="equip"]');
  if (btn) btn.click();
  document.getElementById('status').textContent = '已切到装备tab';
};
document.addEventListener('DOMContentLoaded', () => {
  window.UI.renderAll();
  document.getElementById('status').textContent = 'mock已渲染背包网格';
});
</script>

<script src="js/ui/ui-equipment.js?v=20260909ident"></script>
<script src="js/ui/ui-bag.js?v=20260909ident"></script>
</body>
</html>
