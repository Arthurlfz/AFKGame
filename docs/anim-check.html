<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>墨渊魔君 · 16帧攻击动画实测</title>
<style>
  body { background:#111; color:#ddd; font-family:"Microsoft YaHei",sans-serif; padding:20px; }
  .stage { width:320px; height:320px; border:1px solid #444; background:#1a1a22; position:relative; overflow:hidden; display:flex; align-items:flex-end; justify-content:center; margin:16px 0; }
  .stage-avatar { width:280px; height:280px; position:relative; display:flex; align-items:flex-end; justify-content:center; }
  .pet-anim {
    display:block; width:100%; height:100%;
    background-repeat:no-repeat;
    background-position:0 0;
    background-size:calc(var(--af) * 100%) 100%;
    animation:pet-anim-play var(--dur,1.6s) steps(var(--steps,16)) infinite;
    pointer-events:none;
  }
  .pet-anim[data-anim="attack"] {
    animation-iteration-count:1;
    animation-fill-mode:forwards;
  }
  @keyframes pet-anim-play {
    from { background-position:0 0; }
    to   { background-position:calc(var(--af) * -100%) 0; }
  }
  .bar { display:flex; gap:10px; margin:10px 0; flex-wrap:wrap; }
  button { padding:8px 16px; cursor:pointer; background:#3a3a4a; color:#fff; border:1px solid #666; }
  button:hover { background:#555; }
  .status { color:#8f8; font-size:13px; min-height:20px; white-space:pre; }
</style>
</head>
<body>
<h3>墨渊魔君 · 16帧攻击动画实测（不登录、不连服务器，不影响你的游戏）</h3>
<div style="color:#ffcf6b;font-size:13px;margin-bottom:6px;">版本徽标：v20260915m（rAF 帧同步播放器）—— 这里如果不是 i，说明页面是旧缓存，请 Ctrl+F5 强刷</div>
<div class="bar">
  <button id="btn-auto">▶ 一键演示（挂载→自动攻击）</button>
  <button id="btn-attack">攻击动画</button>
  <button id="btn-idle">回待机</button>
</div>
<div class="status" id="status">点「一键演示」看 16 帧攻击（蓄力→能量斩→炸裂→收招）</div>
<div class="stage"><div class="stage-avatar" id="avatar"></div></div>

<script>
window.PetSprites = {
  V: "20260915m",
  animOf: function (n) { if (!n) return null; return this.animMap[n] || (n.indexOf("·异变") > 0 ? this.animMap[n.replace("·异变", "")] : null); },
  paintAnim: function (d, x) { d.style.backgroundImage = "url('" + x.sheet + "?v=" + this.V + "')"; d.style.setProperty("--af", x.frames); d.style.setProperty("--steps", x.frames); d.style.setProperty("--dur", x.dur || "1.6s"); },
  restartAnim: function (d) { d.style.animation = "none"; void d.offsetWidth; d.style.animation = ""; },
  makeAnimNode: function (a, act) { var x = a[act] || a.idle; if (!x || !x.sheet) return null; var d = document.createElement("div"); d.className = "pet-anim"; d.dataset.anim = act; this.paintAnim(d, x); return d; },
  ANIM_ENABLED: false,
  mountAnimated: function (el, n) { if (!el) return false; var a = this.animOf(n); if (!a || !a.idle) return false; if (!this.ANIM_ENABLED && !a.demo) return false; var node = this.makeAnimNode(a, "idle"); if (!node) return false; node.dataset.petName = n; el.textContent = ""; el.appendChild(node); return true; },
  setAnim: function (node, act) { if (!node || !act || node.dataset.anim === act) return; var a = node.dataset.petName && this.animOf(node.dataset.petName); if (!a || !a[act]) return; if (act !== "idle") { this.playFrames(node, act); return; } node.dataset.anim = act; if (node.__raf) cancelAnimationFrame(node.__raf); this.paintAnim(node, a[act]); this.restartAnim(node); },
  playFrames: function (node, act, onDone) { if (!node) return; var anim = node.dataset.petName && this.animOf(node.dataset.petName); var x = anim && anim[act]; if (!x || !x.sheet || !(x.frames > 1)) { if (onDone) onDone(); return; } node.dataset.anim = act; this.paintAnim(node, x); node.style.animation = "none"; if (node.__raf) cancelAnimationFrame(node.__raf); var n = x.frames, durMs = (parseFloat(x.dur) || 1.6) * 1000, start = null; node.style.backgroundPosition = "0% 0"; var step = function (ts) { if (start === null) start = ts; var p = (ts - start) / durMs; if (p >= 1) { node.style.backgroundPosition = "100% 0"; node.__raf = null; if (onDone) onDone(); return; } var idx = Math.min(n - 1, Math.floor(p * n)); node.style.backgroundPosition = ((idx / (n - 1)) * 100).toFixed(2) + "% 0"; node.__raf = requestAnimationFrame(step); }; node.__raf = requestAnimationFrame(step); },
  animMap: {"墨渊魔君":{idle:{sheet:"assets/pets/anim/pack9-moyuan/idle.png",frames:1,dur:"2s"},attack:{sheet:"assets/pets/anim/pack9-moyuan/attack16.png",frames:16,dur:"1.6s"},demo:true}}
};

const st = document.getElementById('status');
const av = document.getElementById('avatar');
let node = null;

function mount() {
  const ok = PetSprites.mountAnimated(av, '墨渊魔君');
  node = av.firstElementChild;
  st.textContent = '挂载: ' + ok + ' | 节点: ' + (node ? node.className + ' anim=' + node.dataset.anim : '无');
}
function attack() {
  if (!node) { st.textContent = '先挂载'; return; }
  PetSprites.setAnim(node, 'attack');
  const c = getComputedStyle(node);
  st.textContent = 'setAnim(attack) → anim=' + node.dataset.anim
    + '\n背景: ' + node.style.backgroundImage.split('/').pop()
    + '\n帧数 --af=' + node.style['--af'] + ' | 动画: ' + c.animation;
  setTimeout(() => { if (node && node.dataset.anim === 'attack') PetSprites.setAnim(node, 'idle'); }, 2200);
}
document.getElementById('btn-auto').onclick = () => { mount(); setTimeout(attack, 300); };
document.getElementById('btn-attack').onclick = attack;
document.getElementById('btn-idle').onclick = () => { if (node) { PetSprites.setAnim(node, 'idle'); st.textContent = '回待机 anim=' + node.dataset.anim; } };
mount();
</script>
</body>
</html>
